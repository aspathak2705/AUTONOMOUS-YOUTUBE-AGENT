services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: autonomous-youtube-agent-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=autonomous-youtube-agent
      - APP_ENV=development
      - APP_DEBUG=true
      - FRONTEND_ORIGIN=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ../backend/app:/app/app:ro
    restart: unless-stopped

  # Optional local PostgreSQL container (for offline dev when Supabase remote connection is unavailable)
